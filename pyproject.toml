[project]
name = "pancreas-protocol-optimization-agent"
version = "0.1.0"
description = "ProtocolOptimizationAgent framework for integrating Agent1 protocol artifacts with h5ad single-cell phenotype analyses."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "langchain-core>=0.3",
  "langchain-openai>=0.3",
  "langgraph>=0.2",
  "langgraph-sdk>=0.4.2",
  "pydantic>=2.0",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
server = [
  "langgraph-cli[inmem]>=0.3",
  "python-dotenv[cli]>=1.0",
]
h5ad = [
  "anndata>=0.10",
  "scanpy>=1.10",
  "pandas>=2.0",
  "scipy>=1.11",
]
data-analysis-tools = [
  "anndata>=0.10",
  "celloracle>=0.18",
  "cellrank>=2.0",
  "celltypist>=1.6",
  "gseapy>=1.0",
  "pandas>=2.0",
  "pyscenic>=0.12",
  "scanpy>=1.10",
  "scipy>=1.11",
  "scib-metrics>=0.5",
  "scvelo>=0.3",
  "scvi-tools>=1.0",
]
dev = [
  "ipython>=8.0",
  "langgraph-cli[inmem]>=0.3",
  "mypy>=1.14",
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
protocol-optimization-agent = "protocol_optimization_agent.interfaces.cli:main"
protocol-analysis-agent = "protocol_optimization_agent.interfaces.protocol_analysis_cli:main"
protocol-query = "protocol_optimization_agent.interfaces.protocol_query_cli:main"
protocol-api = "protocol_optimization_agent.interfaces.api:main"
scientific-state = "protocol_optimization_agent.interfaces.scientific_state_cli:main"
run-archive = "protocol_optimization_agent.interfaces.run_archive_cli:main"

[tool.setuptools.package-dir]
"" = "backend"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
pretty = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["anndata", "fastapi", "scipy", "scipy.*", "uvicorn"]
ignore_missing_imports = true
